[package]
name = "bindgen-demo"
version = "0.0.0"
edition.workspace = true
publish = false
description = "Builds a C library with Fil-C and its bindings in a build script, and calls it"

[features]
glibc = ["fil-rust/glibc"]

[dependencies]
fil-rust = { workspace = true }

[build-dependencies]
fil-rust-bindgen = { workspace = true }
fil-rust-build = { workspace = true }
