[package]
name = "fil-rust-sys"
version.workspace = true
edition.workspace = true
description = "The generated runtime stub, libc stand-ins and support library that Fil-C libraries bind to, embedded for fil-rust-rt"
links = "filrust"

[features]
default = ["musl"]
# Support for Fil-C binaries built with the musl ("pizfix") distribution.
musl = []
# Support for Fil-C binaries built with the glibc ("/opt/fil") distribution.
glibc = []

[dependencies]
libc = { workspace = true }
