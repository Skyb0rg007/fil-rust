[workspace]
resolver = "3"
members = ["crates/*"]
# `cargo test`/`cargo run --example` at the top level mean fil-rust itself.
default-members = ["crates/fil-rust"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
# Workspace crates.
fil-rust = { path = "crates/fil-rust" }
fil-rust-bindgen = { path = "crates/fil-rust-bindgen" }
fil-rust-build = { path = "crates/fil-rust-build" }
fil-rust-macros = { path = "crates/fil-rust-macros" }
fil-rust-sys = { path = "crates/fil-rust-sys", default-features = false }

# External crates.
bindgen = "0.73.2"
libc = "0.2"
prettyplease = "0.3.0"
proptest = "1.12.0"
proc-macro2 = "1.0.107"
quote = "1.0.47"
syn = "3.0.9"
trybuild = "1.0.122"
