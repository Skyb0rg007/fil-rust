[workspace]
members = ["fil-rust-sys", "fil-rust-macros", "fil-rust-bindgen", "examples/bindgen-demo"]

[package]
name = "fil-rust"
version = "0.1.0"
edition = "2024"
description = "A Rust FFI for Fil-C shared libraries"

[features]
default = ["musl", "derive"]
musl = ["fil-rust-sys/musl"]
glibc = ["fil-rust-sys/glibc"]
derive = ["dep:fil-rust-macros"]

[dependencies]
fil-rust-sys = { path = "fil-rust-sys", default-features = false }
fil-rust-macros = { path = "fil-rust-macros", optional = true }
libc = "0.2"
